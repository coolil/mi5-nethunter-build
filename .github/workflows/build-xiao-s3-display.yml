name: Build Single Flashable BIN - XIAO ESP32-S3 Display 2.4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Original Repository
        uses: actions/checkout@v4
        with:
          repository: 'bmorcelli/Launcher'
          submodules: recursive
          fetch-depth: 0

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install PlatformIO & Esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: 4. Inject Display Setup into Official Environment
        run: |
          # 1. Pastikan folder target headless-xiao-esp32s3-8mb tersedia
          mkdir -p boards/headless-xiao-esp32s3-8mb
          
          # 2. Tulis file pins.h untuk Display 2.4" SPI (ILI9341) & Touch (XPT2046)
          cat << 'EOF' > boards/headless-xiao-esp32s3-8mb/pins.h
          #ifndef PINS_H
          #define PINS_H

          #define ILI9341_DRIVER
          #define TFT_WIDTH  240
          #define TFT_HEIGHT 320

          // Pinout SPI XIAO ESP32-S3
          #define TFT_MOSI 9   // D10
          #define TFT_MISO 8   // D9
          #define TFT_SCLK 7   // D8
          #define TFT_CS   1   // D0
          #define TFT_DC   3   // D2
          #define TFT_RST  2   // D1
          #define TFT_BL  -1   // Direct 3V3

          #define TOUCH_CS 4   // D3
          #define SPI_TOUCH_FREQUENCY 2500000
          #define HAS_TOUCH

          #endif
          EOF

          # 3. Inject flag display langsung ke [env:headless-xiao-esp32s3-8mb] di platformio.ini
          sed -i '/\[env:headless-xiao-esp32s3-8mb\]/,/build_flags =/ s/build_flags =/build_flags =\n    -DUSER_SETUP_LOADED=1\n    -DILI9341_DRIVER=1\n    -DTFT_MOSI=9\n    -DTFT_MISO=8\n    -DTFT_SCLK=7\n    -DTFT_CS=1\n    -DTFT_DC=3\n    -DTFT_RST=2\n    -DTOUCH_CS=4\n    -DHAS_TOUCH=1/' platformio.ini

      - name: 5. Build Official Environment
        run: |
          pio run -e headless-xiao-esp32s3-8mb

      - name: 6. Merge Artifacts into 1 Single BIN (Offset 0x00)
        run: |
          mkdir -p output
          BUILD_DIR=".pio/build/headless-xiao-esp32s3-8mb"
          
          # Lokasi boot_app0 bawaan pioarduino
          BOOT_APP0=$(find ~/.platformio/packages/ -name "boot_app0.bin" | head -n 1)
          
          # Penggabungan komponen firmware menjadi 1 file tunggal (0x0000)
          esptool.py --chip esp32s3 merge_bin \
            -o output/Launcher-XIAO-S3-Display-2.4in-SINGLE.bin \
            --flash_mode dio \
            --flash_size 8MB \
            0x0000 "$BUILD_DIR/bootloader.bin" \
            0x8000 "$BUILD_DIR/partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$BUILD_DIR/firmware.bin"

      - name: 7. Upload Single Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-XIAO-S3-Display-2.4in-SINGLE
          path: output/Launcher-XIAO-S3-Display-2.4in-SINGLE.bin
          retention-days: 14
