name: Build Single Flashable BIN - XIAO ESP32-S3 Display 2.4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Original Repository
        uses: actions/checkout@v4
        with:
          repository: 'bmorcelli/Launcher'
          submodules: recursive
          fetch-depth: 0

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install PlatformIO & Esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: 4. Patch CYD Pins directly to XIAO ESP32-S3 Pinout
        run: |
          # Temukan dan timpa file pins.h milik CYD-2432S028 agar menggunakan pin XIAO ESP32-S3
          CYD_PIN_FILE=$(find boards -path "*/CYD-2432S028*/pins.h" | head -n 1)
          
          cat << 'EOF' > "$CYD_PIN_FILE"
          #ifndef PINS_H
          #define PINS_H

          #define ILI9341_DRIVER
          #define TFT_WIDTH  240
          #define TFT_HEIGHT 320

          // Pinout Khusus XIAO ESP32-S3 Sense
          #define TFT_MOSI 9   // D10
          #define TFT_MISO 8   // D9
          #define TFT_SCLK 7   // D8
          #define TFT_CS   1   // D0
          #define TFT_DC   3   // D2
          #define TFT_RST  2   // D1
          #define TFT_BL  -1   // Direct 3V3

          #define TOUCH_CS 4   // D3
          #define SPI_TOUCH_FREQUENCY 2500000
          #define HAS_TOUCH

          #endif
          EOF

      - name: 5. Build Native CYD Environment (Patched for XIAO)
        run: |
          pio run -e CYD-2432S028

      - name: 6. Merge All Artifacts into 1 Single BIN (Offset 0x00)
        run: |
          mkdir -p output
          BUILD_DIR=".pio/build/CYD-2432S028"
          
          # Ambil boot_app0 bawaan platformio
          BOOT_APP0=$(find ~/.platformio/packages/ -name "boot_app0.bin" | head -n 1)
          
          # Merge firmware menjadi 1 file tunggal 0x0000
          esptool.py --chip esp32 merge_bin \
            -o output/Launcher-XIAO-S3-Display-2.4in-SINGLE.bin \
            --flash_mode dio \
            --flash_size 8MB \
            0x0000 "$BUILD_DIR/bootloader.bin" \
            0x8000 "$BUILD_DIR/partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$BUILD_DIR/firmware.bin"

      - name: 7. Upload Single Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-XIAO-S3-Display-2.4in-SINGLE
          path: output/Launcher-XIAO-S3-Display-2.4in-SINGLE.bin
          retention-days: 14
