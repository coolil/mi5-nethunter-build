name: Build Single Flashable BIN - XIAO ESP32-S3 Display 2.4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Original Repository
        uses: actions/checkout@v4
        with:
          repository: 'bmorcelli/Launcher'
          submodules: recursive
          fetch-depth: 0

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install PlatformIO & Esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: 4. Inject Custom Display Pins & Override Headless Env
        run: |
          # 1. Buat folder board khusus
          mkdir -p boards/xiao-esp32s3-display
          
          # 2. Buat file pins.h khusus LCD ILI9341 2.4 SPI & Touch XPT2046
          cat << 'EOF' > boards/xiao-esp32s3-display/pins.h
          #ifndef PINS_H
          #define PINS_H

          #define ILI9341_DRIVER
          #define TFT_WIDTH  240
          #define TFT_HEIGHT 320

          #define TFT_MOSI 9   // D10
          #define TFT_MISO 8   // D9
          #define TFT_SCLK 7   // D8
          #define TFT_CS   1   // D0
          #define TFT_DC   3   // D2
          #define TFT_RST  2   // D1
          #define TFT_BL  -1   // Direct 3V3

          #define TOUCH_CS 4   // D3
          #define SPI_TOUCH_FREQUENCY 2500000
          #define HAS_TOUCH

          #endif
          EOF

          # 3. Timpa/Tambahkan build_flags ke env:xiao-esp32s3-headless bawaan repo
          # Ini mencegah bug PlatformIO builder karena menggunakan platform yang sudah valid
          cat << 'EOF' >> platformio.ini

          [env:xiao-esp32s3-display]
          extends = env:xiao-esp32s3-headless
          board_build.configurations = boards/xiao-esp32s3-display/pins.h
          build_flags =
              ${env:xiao-esp32s3-headless.build_flags}
              -include boards/xiao-esp32s3-display/pins.h
              -DUSER_SETUP_LOADED=1
              -DILI9341_DRIVER=1
              -DTFT_MOSI=9
              -DTFT_MISO=8
              -DTFT_SCLK=7
              -DTFT_CS=1
              -DTFT_DC=3
              -DTFT_RST=2
              -DTOUCH_CS=4
              -DHAS_TOUCH=1
          EOF

      - name: 5. Pre-install Espressif Platform & Build
        run: |
          # Install platform espressif32 secara eksplisit untuk mencegah error python env
          pio pkg install --platform "platformio/espressif32"
          pio run -e xiao-esp32s3-display

      - name: 6. Merge All Artifacts into 1 Single BIN (Offset 0x00)
        run: |
          mkdir -p output
          BUILD_DIR=".pio/build/xiao-esp32s3-display"
          
          # Cari boot_app0.bin bawaan espressif32
          BOOT_APP0=$(find ~/.platformio/packages/ -name "boot_app0.bin" | head -n 1)
          
          # Merge firmware menjadi 1 file tunggal 0x0000
          esptool.py --chip esp32s3 merge_bin \
            -o output/Launcher-XIAO-S3-Display-2.4in-SINGLE.bin \
            --flash_mode dio \
            --flash_size 8MB \
            0x0000 "$BUILD_DIR/bootloader.bin" \
            0x8000 "$BUILD_DIR/partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$BUILD_DIR/firmware.bin"

      - name: 7. Upload Single Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-XIAO-S3-Display-2.4in-SINGLE
          path: output/Launcher-XIAO-S3-Display-2.4in-SINGLE.bin
          retention-days: 14
