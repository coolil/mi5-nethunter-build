name: Build Single Flashable BIN - XIAO ESP32-S3 Display 2.4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Original Repository
        uses: actions/checkout@v4
        with:
          repository: 'bmorcelli/Launcher'
          submodules: recursive
          fetch-depth: 0

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install PlatformIO & Esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: 4. Inject Custom Board Pinout & Environment
        run: |
          # Buat folder konfigurasi board khusus XIAO ESP32-S3 Display
          mkdir -p include/boards
          
          # Tulis file header pins.h untuk LCD ILI9341 + Touch XPT2046
          cat << 'EOF' > include/boards/xiao-esp32s3-display.h
          #ifndef BOARD_PINS_H
          #define BOARD_PINS_H

          #define ILI9341_DRIVER
          #define TFT_WIDTH  240
          #define TFT_HEIGHT 320

          #define TFT_MOSI 9   // D10
          #define TFT_MISO 8   // D9
          #define TFT_SCLK 7   // D8
          #define TFT_CS   1   // D0
          #define TFT_DC   3   // D2
          #define TFT_RST  2   // D1
          #define TFT_BL  -1   // Direct 3V3

          #define TOUCH_CS 4   // D3
          #define SPI_TOUCH_FREQUENCY 2500000
          #define HAS_TOUCH

          #endif
          EOF

          # Inject environment baru ke platformio.ini
          cat << 'EOF' >> platformio.ini

          [env:xiao-esp32s3-display]
          extends = env:esp32s3_base
          board = seeed_xiao_esp32s3
          build_flags =
              ${env:esp32s3_base.build_flags}
              -include include/boards/xiao-esp32s3-display.h
              -DBOARD_HAS_PSRAM
              -DCONFIG_SPIRAM_MODE_OCT
              -DUSER_SETUP_LOADED=1
              -DILI9341_DRIVER=1
              -DTFT_MOSI=9
              -DTFT_MISO=8
              -DTFT_SCLK=7
              -DTFT_CS=1
              -DTFT_DC=3
              -DTFT_RST=2
              -DTOUCH_CS=4
          EOF

      - name: 5. Build Project with PlatformIO
        run: |
          pio run -e xiao-esp32s3-display

      - name: 6. Merge All Artifacts into 1 Single BIN (Offset 0x00)
        run: |
          mkdir -p output
          BUILD_DIR=".pio/build/xiao-esp32s3-display"
          
          # Ambil boot_app0 bawaan framework espressif32
          BOOT_APP0=$(find ~/.platformio/packages/ -name "boot_app0.bin" | head -n 1)
          
          # Menggabungkan komponen firmware (0x0000, 0x8000, 0xe000, 0x10000)
          esptool.py --chip esp32s3 merge_bin \
            -o output/Launcher-XIAO-S3-Display-2.4in-SINGLE.bin \
            --flash_mode dio \
            --flash_size 8MB \
            0x0000 "$BUILD_DIR/bootloader.bin" \
            0x8000 "$BUILD_DIR/partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$BUILD_DIR/firmware.bin"

      - name: 7. Upload Single Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-XIAO-S3-Display-2.4in-SINGLE
          path: output/Launcher-XIAO-S3-Display-2.4in-SINGLE.bin
          retention-days: 14
