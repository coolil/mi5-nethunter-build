name: Build Single Flashable BIN - XIAO ESP32-S3 Display 2.4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Original Repository
        uses: actions/checkout@v4
        with:
          repository: 'bmorcelli/Launcher'
          submodules: recursive
          fetch-depth: 0

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install PlatformIO & Esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: 4. Inject Display Setup & Force GFX Drivers
        run: |
          mkdir -p boards/headless-xiao-esp32s3-8mb
          
          # Tulis pins.h dengan macro komplit bawaan Launcher
          cat << 'EOF' > boards/headless-xiao-esp32s3-8mb/pins.h
          #ifndef PINS_H
          #define PINS_H

          // Driver LCD ILI9341
          #define ILI9341_DRIVER
          #define TFT_WIDTH  240
          #define TFT_HEIGHT 320

          // Pinout SPI XIAO ESP32-S3 Sense
          #define TFT_MOSI 9   // D10
          #define TFT_MISO 8   // D9
          #define TFT_SCLK 7   // D8
          #define TFT_CS   1   // D0
          #define TFT_DC   3   // D2
          #define TFT_RST  2   // D1
          #define TFT_BL  -1   // Direct 3V3

          #define TOUCH_CS 4   // D3
          #define SPI_TOUCH_FREQUENCY 2500000
          #define HAS_TOUCH
          #define BOARD_HAS_PSRAM

          #endif
          EOF

          # Inject macro pengaktif layar langsung ke platformio.ini
          cat << 'EOF' >> platformio.ini

          # Override display setup
          [env:headless-xiao-esp32s3-8mb]
          build_flags =
              ${env:headless-esp32s3-8mb.build_flags}
              -include boards/headless-xiao-esp32s3-8mb/pins.h
              -DUSER_SETUP_LOADED=1
              -DILI9341_DRIVER=1
              -DTFT_WIDTH=240
              -DTFT_HEIGHT=320
              -DTFT_MOSI=9
              -DTFT_MISO=8
              -DTFT_SCLK=7
              -DTFT_CS=1
              -DTFT_DC=3
              -DTFT_RST=2
              -DTOUCH_CS=4
              -DHAS_TOUCH=1
          EOF

      - name: 5. Build Firmware
        run: |
          pio run -e headless-xiao-esp32s3-8mb

      - name: 6. Prepare Single BIN Output
        run: |
          mkdir -p output
          MERGED_FILE=$(find . -name "Launcher-headless-xiao-esp32s3-8mb.bin" | head -n 1)
          
          if [ -f "$MERGED_FILE" ]; then
            cp "$MERGED_FILE" output/Launcher-XIAO-S3-Display-2.4in-SINGLE.bin
          else
            cp .pio/build/headless-xiao-esp32s3-8mb/firmware.factory.bin output/Launcher-XIAO-S3-Display-2.4in-SINGLE.bin
          fi

      - name: 7. Upload Single Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-XIAO-S3-Display-2.4in-SINGLE
          path: output/Launcher-XIAO-S3-Display-2.4in-SINGLE.bin
          retention-days: 14
