name: Build Bluepad32 via PlatformIO

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Bisa dijalankan manual via tombol di tab Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone Official Bluepad32 Repository
        run: |
          git clone --recursive https://github.com/ricardoquesada/bluepad32.git official_bluepad32

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO & esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Compile Firmware dengan PlatformIO
        run: |
          cd official_bluepad32/src/platforms/esp32
          # PlatformIO akan mengunduh semua toolchain dan mengompilasi proyek secara otomatis
          pio run -e esp32

      - name: Merge Binary Menjadi 1 File Tunggal (.bin)
        run: |
          cd official_bluepad32/src/platforms/esp32/.pio/build/esp32
          
          # Menggabungkan Bootloader (0x1000), Partition Table (0x8000), dan Application (0x10000)
          esptool.py --chip esp32 merge_bin \
            -o merged-bluepad32-esp32.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x1000 bootloader.bin \
            0x8000 partitions.bin \
            0x10000 firmware.bin

          mkdir -p $GITHUB_WORKSPACE/output_bin
          cp merged-bluepad32-esp32.bin $GITHUB_WORKSPACE/output_bin/

      - name: Upload Single BIN File sebagai GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluepad32-esp32-single-factory-bin
          path: output_bin/merged-bluepad32-esp32.bin
