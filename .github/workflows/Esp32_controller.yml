name: Build Bluepad32 Factory Binary (Official Source)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Bisa dijalankan manual via tombol di tab Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Bluepad32 Official Repository
        run: |
          git clone --recursive https://github.com/ricardoquesada/bluepad32.git official_bluepad32

      - name: Integrasi BTStack
        run: |
          cd official_bluepad32
          INTEGRATE_SCRIPT=$(find . -name "integrate_btstack.py" -print -quit)
          if [ -n "$INTEGRATE_SCRIPT" ]; then
            cd $(dirname "$INTEGRATE_SCRIPT")
            python3 integrate_btstack.py
          fi

      - name: Install esptool
        run: |
          python3 -m pip install --upgrade pip
          pip install esptool

      - name: Compile menggunakan ESP-IDF Action
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: 'v5.3'
          target: 'esp32'
          path: 'official_bluepad32/examples/esp32'

      - name: Merge File Biner Menjadi 1 File (.bin)
        run: |
          cd official_bluepad32/examples/esp32/build
          
          # Menggabungkan Bootloader, Partition Table, dan Firmware Utama
          esptool.py --chip esp32 merge_bin \
            -o merged-bluepad32-esp32.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x1000 bootloader/bootloader.bin \
            0x8000 partition_table/partition-table.bin \
            0x10000 bluepad32-esp32.bin

          mkdir -p $GITHUB_WORKSPACE/output_bin
          cp merged-bluepad32-esp32.bin $GITHUB_WORKSPACE/output_bin/

      - name: Upload Single BIN File sebagai GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluepad32-esp32-single-factory-bin
          path: output_bin/merged-bluepad32-esp32.bin
