name: Build Single Factory Binary Bluepad32 for ESP32

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3 # Menjalankan seluruh proses di dalam container SDK ESP-IDF resmi

    steps:
      - name: Checkout Repository Utama
        uses: actions/checkout@v4

      - name: Clone Repository Resmi Bluepad32
        run: |
          git clone --recursive https://github.com/ricardoquesada/bluepad32.git official_bluepad32

      - name: Integrasi BTStack ke Bluepad32
        run: |
          cd official_bluepad32/external/btstack/port/esp32
          # Parameter IDF_PATH resmi sesuai dokumentasi Bluepad32
          IDF_PATH=../../../../src ./integrate_btstack.py

      - name: Compile Firmware Bluepad32
        run: |
          cd official_bluepad32/examples/esp32
          idf.py set-target esp32
          idf.py build

      - name: Install esptool & Merge Binary Menjadi 1 File (.bin)
        run: |
          python -m pip install esptool
          
          cd official_bluepad32/examples/esp32/build
          
          # Mencari file binary aplikasi utama hasil compile
          APP_BIN=$(ls *.bin | grep -v "bootloader" | grep -v "partition" | head -n 1)
          
          # Menggabungkan Bootloader, Partition Table, dan Application menjadi 1 file tunggal
          esptool.py --chip esp32 merge_bin \
            -o merged-bluepad32-esp32.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x1000 bootloader/bootloader.bin \
            0x8000 partition_table/partition-table.bin \
            0x10000 "$APP_BIN"

          mkdir -p $GITHUB_WORKSPACE/output_bin
          cp merged-bluepad32-esp32.bin $GITHUB_WORKSPACE/output_bin/

      - name: Upload Single BIN File sebagai GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluepad32-esp32-single-factory-bin
          path: output_bin/merged-bluepad32-esp32.bin
